{% extends "layout.html" %}
{% block title %}Miskatonik Assistant - Weakness{% endblock %}
{% block start_content %}
{% endblock %}
{% block content %}
<div class="container-lg text-center">
    <div class="row align-items-center">
        <div class="col">
            <button class="btn btn-secondary m-1" id="btnDrawPlayer" role="button" value="">
                Draw
            </button>
            <button class="btn btn-secondary m-1" id="btnThreePlayer" role="button" value="">
                Draw 3
            </button>
            <button class="btn btn-secondary m-1 disabled" id="btnResetPlayer" role="button" value="">
                Reset
            </button>
        </div>
    </div>
    <div class="row align-items-center">
        {% for investigator in investigators: %}
        <div class="col arkhamCardFocus" id="divP{{investigator.id}}">
            <div class="d-inline-block card mt-2">
                <div class="card-header">
                    <h6>Investigator {{investigator.name}}</h6>
                </div>
                <div class="card-body">
                    <img class="img-fluid rounded card-img-top flip flip-back" id="imgP{{investigator.id}}"
                        src="{{(cdn_root + "/cardback.png")}}" alt="Basic Weakness Card" />
                </div>
                <div class="card-footer text-body-secondary" id="footP{{investigator.id}}">
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
