{% extends "layout.html" %}
{% block title %}Miskatonik Assistant - Weakness{% endblock %}
{% block start_content %}
{% endblock %}
{% block content %}
<div class="container-lg text-center">
    <div class="row g-1 align-items-center">
        {% for investigator in investigators: %}
        <div class="col arkhamCardFocus align-self-start" id="divP{{investigator.id}}">
            <div class="d-inline-block card">
                <div class="card-header">
                    <h6>Investigator {{investigator.name}}</h6>
                </div>
                <div class="card-body">
                    <img class="img-fluid rounded card-img-top flip flip-back" id="imgP{{investigator.id}}"
                        src="{{(cdn_root + "/cardback.png")}}" alt="Basic Weakness Card" value="{{investigator.id}}" />
                </div>
                <div class="card-footer text-body-secondary" id="footP{{investigator.id}}">
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
